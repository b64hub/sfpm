name: release

# Replaces onPushToMain.yml + onRelease.yml, which could not work:
#   - the root package is `private: true` with no `prepack` script, so
#     `npm run prepack` + npm-publish at the root always failed
#   - workspace deps use pnpm's `workspace:` protocol, which `npm publish`
#     cannot rewrite; `pnpm publish` replaces them with real versions
on:
  workflow_dispatch:

permissions:
  contents: write # commit the regenerated CLI README, create the release, move rolling major tag
  id-token: write # OIDC token for npm trusted publishing (pnpm publish uses this automatically)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # corepack honours `packageManager` in package.json, so the pnpm version
      # is pinned by the repo and no third-party setup action is needed.
      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate: the committed runtime lockfile must pin what its manifest asks
      # for, or the actions would install an unintended version.
      - name: Verify action runtime lockfile
        run: node scripts/sync-action-runtime.mjs --check

      - run: pnpm build

      - name: Regenerate CLI README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm --filter @b64hub/sfpm-cli exec oclif readme
          if [ -n "$(git status --porcelain)" ]; then
            git commit -am "chore: update CLI README"
            git push origin HEAD:main
          fi

      - name: Resolve release tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "major=v${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning file=package.json,line=1::$tag is already released. Bump the version in package.json to publish a new release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Skips workspace packages whose version is already on the registry, and
      # rewrites `workspace:` ranges to real versions. Root is private, so it
      # is excluded automatically.
      - name: Publish to npm
        if: steps.version.outputs.skip == 'false'
        run: pnpm publish -r --access public --no-git-checks

      # Phase 2: the runtime lockfile can only pin a version that exists on the
      # registry, so it is regenerated after publishing and committed before the
      # tag is created. The tag therefore contains a lockfile pinning exactly
      # the versions this release published.
      - name: Repin action runtime to the published version
        if: steps.version.outputs.skip == 'false'
        run: |
          node scripts/sync-action-runtime.mjs
          if [ -n "$(git status --porcelain packages/actions/runtime)" ]; then
            git add packages/actions/runtime
            git commit -m "chore: repin action runtime to $TAG"
            git push origin HEAD:main
          fi
        env:
          TAG: ${{ steps.version.outputs.tag }}

      - name: Create release and move rolling major tag
        if: steps.version.outputs.skip == 'false'
        run: |
          # Re-read HEAD: the repin commit above may have moved it.
          sha=$(git rev-parse HEAD)
          gh release create "$TAG" --target "$sha" --title "$TAG" --generate-notes
          # vN is the only tag that ever moves; vN.x.y are protected create-only.
          git tag -f -a "$MAJOR" -m "Rolling tag for $TAG" "$sha"
          git push --force origin "$MAJOR"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
