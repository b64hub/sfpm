name: release

# Replaces onPushToMain.yml + onRelease.yml, which could not work:
#   - the root package is `private: true` with no `prepack` script, so
#     `npm run prepack` + npm-publish at the root always failed
#   - workspace deps use pnpm's `workspace:` protocol, which `npm publish`
#     cannot rewrite; `pnpm publish` replaces them with real versions
on:
  workflow_dispatch:

permissions:
  contents: write # commit the regenerated CLI README, create the tag commit and release, move rolling major tag
  id-token: write # OIDC token for npm trusted publishing (pnpm publish uses this automatically)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # corepack honours `packageManager` in package.json, so the pnpm version
      # is pinned by the repo and no third-party setup action is needed.
      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Regenerate CLI README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm --filter @b64hub/sfpm-cli exec oclif readme
          if [ -n "$(git status --porcelain)" ]; then
            git commit -am "chore: update CLI README"
            git push origin HEAD:main
          fi

      - name: Resolve release tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "major=v${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning file=package.json,line=1::$tag is already released. Bump the version in package.json to publish a new release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Skips workspace packages whose version is already on the registry, and
      # rewrites `workspace:` ranges to real versions. Root is private, so it
      # is excluded automatically.
      - name: Publish to npm
        if: steps.version.outputs.skip == 'false'
        run: pnpm publish -r --access public --no-git-checks

      - name: Build action bundle
        if: steps.version.outputs.skip == 'false'
        run: node scripts/build-action-bundle.mjs

      - name: Smoke test action bundle
        if: steps.version.outputs.skip == 'false'
        run: node scripts/smoke-test-action-bundle.mjs

      - name: Create tag commit and release
        if: steps.version.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add -f packages/actions/bundle
          git commit -m "release: action bundle for $TAG"
          sha=$(git rev-parse HEAD)
          git tag -a "$TAG" -m "$TAG" "$sha"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          git tag -f -a "$MAJOR" -m "Rolling tag for $TAG" "$sha"
          git push --force origin "$MAJOR"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
