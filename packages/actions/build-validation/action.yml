name: 'SFPM Build Validation'
description: 'Resolve pending async validation for unlocked packages from a build job'
author: 'b64'

branding:
  icon: 'refresh-cw'
  color: 'blue'

inputs:
  build-result:
    description: 'JSON result output from the build job/action (e.g. needs.build.outputs.result)'
    required: true
  packages:
    description: 'Comma-separated list of package names to resolve validation for. Defaults to all packages with pending validation.'
    required: false
  max-wait-minutes:
    description: 'Maximum time to wait for validation completion in minutes (default: 120)'
    required: false
    default: '120'
  polling-interval-seconds:
    description: 'Time between validation status checks in seconds (default: 30)'
    required: false
    default: '30'
  project-dir:
    description: 'Path to the SFPM project directory (defaults to workspace root)'
    required: false

outputs:
  success:
    description: 'Whether all validations passed (true/false)'
  duration:
    description: 'Total resume duration in milliseconds'
  validated-count:
    description: 'Number of packages that passed validation'
  failed-count:
    description: 'Number of packages that failed validation'
  failed-packages:
    description: 'Comma-separated list of packages that failed validation'
  publishable-packages:
    description: 'Comma-separated list of packages safe to publish: built successfully, not build-skipped, and validated if validation was required'
  result:
    description: 'Full JSON result with per-package validation outcomes'

runs:
  using: 'node20'
  main: '../dist/build-validation-main.js'
