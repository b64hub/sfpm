name: 'SFPM Clean Pool'
description: 'Delete orgs from a scratch org or sandbox pool'
author: 'b64'

branding:
  icon: 'trash-2'
  color: 'red'

inputs:
  devhub-username:
    description: 'DevHub (or production org for sandboxes) username or alias'
    required: true
  pool-tag:
    description: 'Pool tag to delete orgs from. Accepts multiple tags, one per line or comma-separated, to clean several pools in one run'
    required: true
  pool-type:
    description: 'Pool type: scratch or sandbox (default: scratch)'
    required: false
    default: 'scratch'
  in-progress-only:
    description: 'Only delete orgs with "In Progress" status'
    required: false
    default: 'false'
  my-pool:
    description: 'Only delete orgs created by the current user'
    required: false
    default: 'false'

outputs:
  success:
    description: 'Whether all matching orgs were deleted successfully (true/false)'
    value: ${{ steps.clean-pool.outputs.success }}
  tag:
    description: 'The pool tag'
    value: ${{ steps.clean-pool.outputs.tag }}
  deleted:
    description: 'Number of orgs deleted'
    value: ${{ steps.clean-pool.outputs.deleted }}
  duration:
    description: 'Total cleanup duration in milliseconds'
    value: ${{ steps.clean-pool.outputs.duration }}
  org-usernames:
    description: 'Comma-separated list of deleted org usernames'
    value: ${{ steps.clean-pool.outputs.org-usernames }}
  result:
    description: 'Full JSON result'
    value: ${{ steps.clean-pool.outputs.result }}

runs:
  using: composite
  steps:
    - id: clean-pool
      shell: bash
      # The runtime directory is shared by every SFPM action. Its committed
      # lockfile pins the whole transitive tree, and `npm ci` verifies the
      # integrity hash of every tarball it downloads.
      run: |
        runtime="$GITHUB_ACTION_PATH/../runtime"
        # Reuse the tree when another SFPM action already installed it in this job.
        [ -d "$runtime/node_modules" ] || npm ci --prefix "$runtime" --ignore-scripts
        "$runtime/node_modules/.bin/sfpm-action" clean-pool
      # Composite actions do not receive INPUT_* automatically, so each input is
      # forwarded explicitly. Callers still use plain `with:`.
      env:
        INPUT_DEVHUB-USERNAME: ${{ inputs.devhub-username }}
        INPUT_POOL-TAG: ${{ inputs.pool-tag }}
        INPUT_POOL-TYPE: ${{ inputs.pool-type }}
        INPUT_IN-PROGRESS-ONLY: ${{ inputs.in-progress-only }}
        INPUT_MY-POOL: ${{ inputs.my-pool }}
