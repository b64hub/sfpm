# Keeps a scratch org pool topped up on a schedule.
# Requires repo secrets: SFDX_CONSUMER_KEY, SFDX_JWT_KEY, DEVHUB_USERNAME.
#
# This is a consumer workflow: it references the sfpm actions remotely
# (`b64hub/sfpm/packages/actions/<name>@<ref>`, no local checkout of sfpm and
# no container image) and sets up its own prerequisites. Replace `<sha>` with
# the commit SHA of the sfpm release you're pinning to — see
# packages/actions/CONSUMING.md in the sfpm repo for allowlisting guidance.
name: SFPM Fill Pool

on:
  schedule:
    - cron: '0 6 * * 1-5' # weekday mornings
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install sf CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate DevHub
        run: |
          echo "${{ secrets.SFDX_JWT_KEY }}" > server.key
          sf org login jwt \
            --client-id "${{ secrets.SFDX_CONSUMER_KEY }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.DEVHUB_USERNAME }}" \
            --set-default-dev-hub \
            --alias devhub
          rm server.key

      - name: Fill pool
        id: fill
        uses: b64hub/sfpm/packages/actions/fill-pool@<sha>
        with:
          devhub-username: devhub
          pool-tag: ci-pool
          max-allocation: '10'

      - name: Report outcome
        if: always()
        run: |
          echo "Succeeded: ${{ steps.fill.outputs.succeeded }}"
          echo "Failed: ${{ steps.fill.outputs.failed }}"
