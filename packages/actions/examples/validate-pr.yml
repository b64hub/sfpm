# Validates a PR. Default mode is 'local': compile + dependency checks via
# the local nimbus validator only — no scratch org, no DevHub auth needed.
#
# For a real deploy against a pooled scratch org instead, set mode: org (see
# commented block below) — requires repo secrets SFDX_CONSUMER_KEY,
# SFDX_JWT_KEY, DEVHUB_USERNAME, and a scratch org pool tag. Unlocked
# packages are always forced source-only in org mode — PR validation never
# creates a real package version (that only happens on push to main, via the
# `build` action), so concurrent PRs can't race for conflicting build numbers.
#
# Runs on the sfpm image (node + pnpm + turbo + sf CLI + sfpm CLI preinstalled)
# so this workflow doesn't need to set those up itself. This is just a
# convenience image, not a requirement — swap `container:` for any `node:22`
# image and add back `pnpm/action-setup`, `actions/setup-node`, and
# `npm install --global @salesforce/cli` if you'd rather not depend on it.
name: SFPM Validate PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/b64hub/sfpm-actions:latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the action can diff against the PR base to detect changed
          # packages (default when `packages` input isn't set). Without this,
          # the base commit usually isn't available locally and the action
          # falls back to validating all packages (with a warning).
          fetch-depth: 0

      # Builds the actions package (and its workspace deps) so dist/validate-main.js exists.
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@b64hub/sfpm-actions...

      - name: Validate PR
        id: validate
        uses: ./packages/actions/validate-pr

      # --- org mode instead (deploy to a pooled scratch org) ---
      # - name: Authenticate DevHub
      #   run: |
      #     echo "${{ secrets.SFDX_JWT_KEY }}" > server.key
      #     sf org login jwt \
      #       --client-id "${{ secrets.SFDX_CONSUMER_KEY }}" \
      #       --jwt-key-file server.key \
      #       --username "${{ secrets.DEVHUB_USERNAME }}" \
      #       --set-default-dev-hub \
      #       --alias devhub
      #     rm server.key
      #
      # - name: Validate PR
      #   id: validate
      #   uses: ./packages/actions/validate-pr
      #   with:
      #     mode: org
      #     devhub-username: devhub
      #     pool-tag: ci-pool
      #     cache-ttl-hours: '6'

      - name: Report outcome
        if: always()
        run: |
          echo "Success: ${{ steps.validate.outputs.success }}"
          echo "Org: ${{ steps.validate.outputs.org-username }}"
          echo "Cache hit: ${{ steps.validate.outputs.cache-hit }}"
