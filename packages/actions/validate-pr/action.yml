name: 'SFPM Validate PR'
description: 'Validate a pull request via local nimbus checks or a deploy against a pooled scratch org'
author: 'b64'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  devhub-username:
    description: 'DevHub username or alias for org pool access. Required when mode is org.'
    required: false
  mode:
    description: 'Validation mode: local (default, nimbus compile + dependency checks, no scratch org) or org (deploy to a pooled scratch org, unlocked packages forced source-only)'
    required: false
    default: 'local'
  pool-tag:
    description: 'Pool tag to fetch orgs from. Required when mode is org.'
    required: false
  pool-type:
    description: 'Pool type: scratch or sandbox (inferred from sfpm.config.ts orgs[tag] if omitted, default scratch)'
    required: false
  cache-ttl-hours:
    description: 'How long to cache an org for this PR (hours). Set to 0 to disable caching. Only used when mode is org.'
    required: false
    default: '4'
  project-dir:
    description: 'Path to the SFPM project directory (defaults to workspace root)'
    required: false
  packages:
    description: 'Comma-separated list of packages to deploy. Defaults to only packages changed against base-ref (or all packages if no base ref is available).'
    required: false
  base-ref:
    description: 'Git ref to diff against for changed-package detection (default: PR base SHA). Only used when packages is not set. Requires checkout with fetch-depth: 0 or otherwise fetching the PR base ref.'
    required: false

outputs:
  success:
    description: 'Whether all validations succeeded (true/false)'
    value: ${{ steps.validate-pr.outputs.success }}
  org-username:
    description: 'Username of the scratch org used for validation'
    value: ${{ steps.validate-pr.outputs.org-username }}
  org-id:
    description: 'Org ID of the scratch org used'
    value: ${{ steps.validate-pr.outputs.org-id }}
  cache-hit:
    description: 'Whether a cached org was reused (true/false)'
    value: ${{ steps.validate-pr.outputs.cache-hit }}
  cache-age-minutes:
    description: 'Age in minutes of the reused cached org. Empty unless cache-hit is true.'
    value: ${{ steps.validate-pr.outputs.cache-age-minutes }}
  pr-number:
    description: 'PR number that was validated'
    value: ${{ steps.validate-pr.outputs.pr-number }}
  duration:
    description: 'Total validation duration in milliseconds'
    value: ${{ steps.validate-pr.outputs.duration }}
  result:
    description: 'Full JSON result with per-package outcomes including coverage'
    value: ${{ steps.validate-pr.outputs.result }}

runs:
  using: composite
  steps:
    - id: validate-pr
      shell: bash
      # The runtime directory is shared by every SFPM action. Its committed
      # lockfile pins the whole transitive tree, and `npm ci` verifies the
      # integrity hash of every tarball it downloads.
      run: |
        runtime="$GITHUB_ACTION_PATH/../runtime"
        # Reuse the tree when another SFPM action already installed it in this job.
        [ -d "$runtime/node_modules" ] || npm ci --prefix "$runtime" --ignore-scripts
        "$runtime/node_modules/.bin/sfpm-action" validate-pr
      # Composite actions do not receive INPUT_* automatically, so each input is
      # forwarded explicitly. Callers still use plain `with:`.
      env:
        INPUT_DEVHUB-USERNAME: ${{ inputs.devhub-username }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_POOL-TAG: ${{ inputs.pool-tag }}
        INPUT_POOL-TYPE: ${{ inputs.pool-type }}
        INPUT_CACHE-TTL-HOURS: ${{ inputs.cache-ttl-hours }}
        INPUT_PROJECT-DIR: ${{ inputs.project-dir }}
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_BASE-REF: ${{ inputs.base-ref }}
