name: 'SFPM Deploy'
description: 'Deploy SFPM packages from published artifacts via direct source deploy (pre-configured install variant, no package version install)'
author: 'b64'

branding:
  icon: 'upload'
  color: 'blue'

inputs:
  target-org:
    description: 'Target org username or alias'
    required: true
  packages:
    description: 'Comma-separated list of packages to deploy'
    required: true
  force:
    description: 'Force redeploy even if already installed with matching version/hash'
    required: false
    default: 'false'
  include-dependencies:
    description: 'Deploy transitive dependencies of requested packages (default: true)'
    required: false
    default: 'true'
  test-level:
    description: 'Deployment test level: NoTestRun, RunSpecifiedTests, RunLocalTests, RunAllTestsInOrg'
    required: false
  regression-test:
    description: 'Run tests in direct dependents after deploy to detect regressions'
    required: false
    default: 'false'
  project-dir:
    description: 'Path to the SFPM project directory (defaults to workspace root)'
    required: false

outputs:
  success:
    description: 'Whether all deploys succeeded (true/false)'
    value: ${{ steps.deploy.outputs.success }}
  duration:
    description: 'Total deploy duration in milliseconds'
    value: ${{ steps.deploy.outputs.duration }}
  failed-packages:
    description: 'Comma-separated list of packages that failed to deploy'
    value: ${{ steps.deploy.outputs.failed-packages }}
  result:
    description: 'Full JSON result with per-package outcomes'
    value: ${{ steps.deploy.outputs.result }}

runs:
  using: composite
  steps:
    - id: deploy
      shell: bash
      # The runtime directory is shared by every SFPM action. Its committed
      # lockfile pins the whole transitive tree, and `npm ci` verifies the
      # integrity hash of every tarball it downloads.
      run: |
        runtime="$GITHUB_ACTION_PATH/../runtime"
        # Reuse the tree when another SFPM action already installed it in this job.
        [ -d "$runtime/node_modules" ] || npm ci --prefix "$runtime" --ignore-scripts
        "$runtime/node_modules/.bin/sfpm-action" deploy
      # Composite actions do not receive INPUT_* automatically, so each input is
      # forwarded explicitly. Callers still use plain `with:`.
      env:
        INPUT_TARGET-ORG: ${{ inputs.target-org }}
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_INCLUDE-DEPENDENCIES: ${{ inputs.include-dependencies }}
        INPUT_TEST-LEVEL: ${{ inputs.test-level }}
        INPUT_REGRESSION-TEST: ${{ inputs.regression-test }}
        INPUT_PROJECT-DIR: ${{ inputs.project-dir }}
