name: 'SFPM Build (Turbo)'
description: 'Aggregate per-package turbo build output into the same result shape the build action produces, for hand-off to build-validation'
author: 'b64'

branding:
  icon: 'package'
  color: 'blue'

inputs:
  packages:
    description: 'Comma-separated list of packages to aggregate. Defaults to all packages.'
    required: false
  task-name:
    description: "Name of the turbo task each package built as (default: 'sfpm:build')"
    required: false
    default: 'sfpm:build'
  project-dir:
    description: 'Path to the SFPM project directory (defaults to workspace root). Also where `turbo run` was invoked and `.turbo/runs/` lives.'
    required: false

outputs:
  success:
    description: 'Whether all builds succeeded (true/false)'
    value: ${{ steps.build-turbo-aggregate.outputs.success }}
  duration:
    description: 'Total aggregation duration in milliseconds'
    value: ${{ steps.build-turbo-aggregate.outputs.duration }}
  failed-packages:
    description: 'Comma-separated list of packages that failed to build'
    value: ${{ steps.build-turbo-aggregate.outputs.failed-packages }}
  result:
    description: "Full JSON result with per-package outcomes, in the same shape as the build action's result output. Pass this into build-validation's build-result input as needs.build.outputs.result"
    value: ${{ steps.build-turbo-aggregate.outputs.result }}

runs:
  using: composite
  steps:
    - id: build-turbo-aggregate
      shell: bash
      # The runtime directory is shared by every SFPM action. Its committed
      # lockfile pins the whole transitive tree, and `npm ci` verifies the
      # integrity hash of every tarball it downloads.
      run: |
        runtime="$GITHUB_ACTION_PATH/../runtime"
        # Reuse the tree when another SFPM action already installed it in this job.
        [ -d "$runtime/node_modules" ] || npm ci --prefix "$runtime" --ignore-scripts
        "$runtime/node_modules/.bin/sfpm-action" build-turbo-aggregate
      # Composite actions do not receive INPUT_* automatically, so each input is
      # forwarded explicitly. Callers still use plain `with:`.
      env:
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_TASK-NAME: ${{ inputs.task-name }}
        INPUT_PROJECT-DIR: ${{ inputs.project-dir }}
