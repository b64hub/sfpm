name: 'SFPM Build'
description: 'Build SFPM packages with async validation for unlocked packages. Returns immediately with creation request IDs while Salesforce validates in the background. Outputs artifact tarballs and per-package results (including pending validation descriptors) for the resume step.'
author: 'b64'

branding:
  icon: 'package'
  color: 'blue'

inputs:
  devhub-username:
    description: 'DevHub username or alias (required for unlocked packages)'
    required: false
  packages:
    description: 'Comma-separated list of packages to build. Defaults to all packages.'
    required: false
  force:
    description: 'Force build even if no source changes detected'
    required: false
    default: 'false'
  include-dependencies:
    description: 'Build transitive dependencies of requested packages (default: true)'
    required: false
    default: 'true'
  build-number:
    description: 'Build number for package versions'
    required: false
  installation-key:
    description: 'Installation key for unlocked packages'
    required: false
  project-dir:
    description: 'Path to the SFPM project directory (defaults to workspace root)'
    required: false
  validation:
    description: 'Validation mode: `none`, `local`, `org` or `full`'
    required: false
    default: 'org'

outputs:
  success:
    description: 'Whether all builds succeeded (true/false)'
  duration:
    description: 'Total build duration in milliseconds'
  failed-packages:
    description: 'Comma-separated list of packages that failed to build'
  result:
    description: "Full JSON result with per-package outcomes, including pending validation descriptors. Pass this into build-validation's build-result input as needs.build.outputs.result"

runs:
  using: 'node20'
  main: '../dist/build-main.js'
