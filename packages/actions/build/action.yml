name: 'SFPM Build'
description: 'Build SFPM packages with async validation for unlocked packages. Returns immediately with creation request IDs while Salesforce validates in the background. Outputs artifact tarballs and per-package results (including pending validation descriptors) for the resume step.'
author: 'b64'

branding:
  icon: 'package'
  color: 'blue'

inputs:
  devhub-username:
    description: 'DevHub username or alias (required for unlocked packages)'
    required: false
  packages:
    description: 'Comma-separated list of packages to build. Defaults to all packages.'
    required: false
  force:
    description: 'Force build even if no source changes detected'
    required: false
    default: 'false'
  include-dependencies:
    description: 'Build transitive dependencies of requested packages (default: true)'
    required: false
    default: 'true'
  build-number:
    description: 'Build number for package versions'
    required: false
  installation-keys:
    description: 'Installation key(s) for unlocked packages. One entry per line as <package-name>=<key>, or a bare value on its own line to use as the default for all packages.'
    required: false
  project-dir:
    description: 'Path to the SFPM project directory (defaults to workspace root)'
    required: false
  validation:
    description: 'Validation mode: `none`, `local`, `org` or `full`'
    required: false
    default: 'org'

outputs:
  success:
    description: 'Whether all builds succeeded (true/false)'
    value: ${{ steps.build.outputs.success }}
  duration:
    description: 'Total build duration in milliseconds'
    value: ${{ steps.build.outputs.duration }}
  failed-packages:
    description: 'Comma-separated list of packages that failed to build'
    value: ${{ steps.build.outputs.failed-packages }}
  result:
    description: "Full JSON result with per-package outcomes, including pending validation descriptors. Pass this into build-validation's build-result input as needs.build.outputs.result"
    value: ${{ steps.build.outputs.result }}

runs:
  using: composite
  steps:
    # Version is pinned, not derived from the action ref, so the executed code
    # is auditable from this file alone. Kept in sync with the package version
    # by the release workflow.
    - id: build
      shell: bash
      run: npx --yes --package=@b64hub/sfpm-actions@0.2.0 sfpm-action build
      # Composite actions do not receive INPUT_* automatically, so each input
      # is forwarded explicitly. Callers still use plain `with:`.
      env:
        INPUT_DEVHUB-USERNAME: ${{ inputs.devhub-username }}
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_INCLUDE-DEPENDENCIES: ${{ inputs.include-dependencies }}
        INPUT_BUILD-NUMBER: ${{ inputs.build-number }}
        INPUT_INSTALLATION-KEYS: ${{ inputs.installation-keys }}
        INPUT_PROJECT-DIR: ${{ inputs.project-dir }}
        INPUT_VALIDATION: ${{ inputs.validation }}
