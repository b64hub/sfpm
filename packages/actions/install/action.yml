name: 'SFPM Install'
description: 'Install SFPM packages into a target org, from the npm registry or from local dist/ build output'
author: 'b64'

branding:
  icon: 'download'
  color: 'blue'

inputs:
  target-org:
    description: 'Target org username or alias'
    required: true
  packages:
    description: 'Comma-separated list of packages to install'
    required: true
  origin:
    description: 'Where to resolve packages from: registry (default, npm) or local (each package dist/ output already on disk, e.g. restored via download-artifact)'
    required: false
    default: 'registry'
  force:
    description: 'Force reinstall even if already installed with matching version/hash'
    required: false
    default: 'false'
  include-dependencies:
    description: 'Install transitive dependencies of requested packages (default: true)'
    required: false
    default: 'true'
  installation-keys:
    description: 'Installation key(s) for unlocked packages. One entry per line as <package-name>=<key>, or a bare value on its own line to use as the default for all packages.'
    required: false
  test-level:
    description: 'Deployment test level (for source deployments): NoTestRun, RunSpecifiedTests, RunLocalTests, RunAllTestsInOrg'
    required: false
  regression-test:
    description: 'Run tests in direct dependents after install to detect regressions'
    required: false
    default: 'false'
  project-dir:
    description: 'Path to the SFPM project directory (defaults to workspace root)'
    required: false

outputs:
  success:
    description: 'Whether all installs succeeded (true/false)'
    value: ${{ steps.install.outputs.success }}
  duration:
    description: 'Total install duration in milliseconds'
    value: ${{ steps.install.outputs.duration }}
  failed-packages:
    description: 'Comma-separated list of packages that failed to install'
    value: ${{ steps.install.outputs.failed-packages }}
  result:
    description: 'Full JSON result with per-package outcomes'
    value: ${{ steps.install.outputs.result }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      # The runtime directory is shared by every SFPM action. Its committed
      # lockfile pins the whole transitive tree, and `npm ci` verifies the
      # integrity hash of every tarball it downloads.
      run: |
        runtime="$GITHUB_ACTION_PATH/../runtime"
        # Reuse the tree when another SFPM action already installed it in this job.
        [ -d "$runtime/node_modules" ] || npm ci --prefix "$runtime" --ignore-scripts
        "$runtime/node_modules/.bin/sfpm-action" install
      # Composite actions do not receive INPUT_* automatically, so each input is
      # forwarded explicitly. Callers still use plain `with:`.
      env:
        INPUT_TARGET-ORG: ${{ inputs.target-org }}
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_ORIGIN: ${{ inputs.origin }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_INCLUDE-DEPENDENCIES: ${{ inputs.include-dependencies }}
        INPUT_INSTALLATION-KEYS: ${{ inputs.installation-keys }}
        INPUT_TEST-LEVEL: ${{ inputs.test-level }}
        INPUT_REGRESSION-TEST: ${{ inputs.regression-test }}
        INPUT_PROJECT-DIR: ${{ inputs.project-dir }}
